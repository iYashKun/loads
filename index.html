<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0">
  <title>SI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-drag: none; user-select: none; }
    html, body { height: 100%; background-color: #000; overflow: hidden; }
    img { width: 200px; height: 200px; animation: spin-reverse 1.5s linear infinite; pointer-events: none; }
    .container { display: flex; justify-content: center; align-items: center; height: 100%; }
    @keyframes spin-reverse { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://raw.githubusercontent.com/iYashKun/loads/refs/heads/main/360F783209193v9-B8ydpT9y.png" alt="SI">
  </div>
</body>
</html>
